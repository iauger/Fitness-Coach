# Fitness Coach — athlete configuration.
#
# Copy to config/athlete.yaml and edit. That file is gitignored; this one is committed, so
# keep anything private out of it. Secrets live in .env, never here — the split is that .env
# is what must not be shared, and this is what you would paste when asking for help.

athlete:
  name: Your Name
  # IANA timezone. Decides what "today" means for a check-in, a session, or a plan week.
  # Everything is stored in UTC underneath; this only affects the athlete's day.
  timezone: UTC
  history_start: 2017            # optional; the first year you have data for
  primary_sport: cycling
  equipment: ""                  # e.g. the head unit you ride with
  # Free text, read by the coach and by nothing else. This is where life load goes — small
  # children, shift work, a long commute. It is what lets a missed week be read as life
  # rather than as a failure, so it is worth writing even though no code looks at it.
  notes: ""
  tools:                         # other tools in the loop, for the coach's context
    - intervals.icu (data aggregation)

# Baseline body and power numbers, used only to seed an empty athlete_profile table.
# src/athlete/profile.py holds dated entries and is the source of truth after that, so editing
# these later does nothing — a new FTP is an event on a date, recorded with
# `python scripts/seed_profile.py --ftp 250`. Leave one out and it is not seeded at all,
# which is better than seeding a guess: every zone in every prescription is a % of FTP.
profile:
  height_in:
  weight_lbs:
  ftp:

goals:
  - description: Cyclocross racing fall 2027
    date: 2027-10-01
    priority: primary            # primary | secondary | opt_in
  - description: Gravel racing spring/summer 2027
    date: 2027-06-18
    priority: opt_in             # opt_in means the plan does not taper for it

plan:
  name: Sustainable rolling
  # The first Monday the plan is of record. Must be a Monday: every week boundary in this
  # project is Monday-to-Sunday, and an off-by-one here silently moves every decision.
  start_monday: 2026-11-02
  # Where the progression gate should climb to, in hours per week. This is intent, not a
  # prescription — the tier ladder is derived from your own synced history, not from these
  # numbers. See ROADMAP, "The tier ladder: derive, don't configure".
  sustainable_band_hours: [3.5, 4.0]
  # The long ride holds here and is extended on demand, never ramped.
  long_ride_ceiling_min: 120
  # An availability ceiling, not a target. How many days a week the ladder asks you to ride is
  # read from what you actually ride; this only stops it climbing past the days you have. 7 is
  # allowed and is a bad idea for most people — that judgement is yours, not the code's.
  max_ride_days: 7
  # Lifting days a week. Never trimmed by a tier, a recovery week or a re-entry week: in the
  # history this plan was designed from, lifting continued in 8 of the 21 weeks where cycling
  # stopped, which is why it is the anchor habit rather than an extra.
  strength_days: 2
  # How many weeks of dated sessions exist at a time. Beyond this is shape, not a schedule.
  horizon_weeks: 3
  goal_date: 2027-10-01          # labels stored plan rows; not a taper target

# Override the workout library. Optional, and most people never will — the defaults are a
# working plan. Named per variant and per key: listing `pct` alone changes the target and
# leaves the reps, the bout length and the rest alone. A name the library does not have
# creates a new variant rather than failing, so the library is extensible, not just adjustable.
#
# A handful of rules are NOT configurable, and an override that breaks one is refused at load
# with the rule named — threshold work never crosses FTP, threshold bouts are 10min+ and
# accumulate 40min+ at roughly 10:1 work:rest, HIIT bouts are 4min+ and sub-maximal, sprints
# are 10-40s, and the easy ride stays easy. Those come from the methodology this plan follows
# and are what stops a config turning a sustainable week into an unsustainable one.
#
# `python scripts/plan_build.py --steps` prints what a variant actually builds.
#
# archetypes:
#   threshold:
#     long_reps:
#       pct: 0.88          # the others (reps, work_min, rest_min) keep their defaults
#   lit:
#     steady:
#       pct: 0.65

integrations:
  intervals_icu:
    # Push the horizon to the intervals.icu calendar. intervals.icu then delivers to Zwift
    # and Garmin if you have those connected there — this project does not write to devices
    # itself, because doing so duplicated every workout.
    push_calendar: true

server:
  # Loopback by default and for good reason: this process holds your intervals.icu and
  # Anthropic keys and has no authentication. Do not expose it until auth exists.
  host: 127.0.0.1
  port: 8800

coach:
  enabled: true
  model: claude-haiku-4-5
