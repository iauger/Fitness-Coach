<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitness Coach</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#111827; --surface:#1f2937; --border:#374151; --text:#f9fafb; --sub:#9ca3af;
          --accent:#60a5fa; --ok:#34d399; --warn:#fbbf24; --bad:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.5 Inter, system-ui, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:8px 24px; align-items:center;
           padding:12px 16px; border-bottom:1px solid var(--border); background:var(--surface); }
  header h1 { font-size:16px; margin:0 8px 0 0; }
  nav { display:flex; flex-wrap:wrap; gap:4px; }
  nav a { color:var(--sub); text-decoration:none; padding:6px 12px; border-radius:6px; }
  nav a.on { color:var(--text); background:rgba(255,255,255,.08); }
  nav a:hover { color:var(--text); }
  main { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
  h2 { font-size:20px; margin:0 0 4px; }
  p.lede { color:var(--sub); margin:0 0 20px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:10px;
          padding:16px; margin-bottom:16px; }
  .card h3 { margin:0 0 4px; font-size:15px; }
  .card p.hint { color:var(--sub); font-size:13px; margin:0 0 12px; }
  .row { display:flex; gap:12px; align-items:flex-start; padding:12px 0;
         border-top:1px solid var(--border); }
  .row:first-child { border-top:0; }
  .mark { width:22px; height:22px; flex:none; border-radius:50%; text-align:center;
          font-size:13px; line-height:22px; color:#111827; font-weight:700; }
  .mark.ok { background:var(--ok); } .mark.next { background:var(--accent); }
  .mark.warn { background:var(--warn); }
  .name { font-weight:600; } .detail { color:var(--sub); font-size:14px; }
  code { display:block; margin-top:6px; padding:8px 10px; background:#0b1220; border-radius:6px;
         font:13px ui-monospace, monospace; color:#d1d5db; overflow-x:auto; white-space:pre; }
  label.f { display:block; margin-bottom:12px; font-size:14px; }
  label.f span { display:block; color:var(--sub); font-size:13px; margin-bottom:4px; }
  input[type=text], input[type=number], input[type=date], select, textarea {
    width:100%; padding:8px 10px; background:#0b1220; color:var(--text);
    border:1px solid var(--border); border-radius:6px; font:inherit; }
  input:focus, select:focus, textarea:focus, button:focus-visible {
    outline:2px solid var(--accent); outline-offset:1px; }
  .days { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:8px; }
  .day { position:relative; text-align:center; font-size:13px; }
  .day label { display:block; padding:6px 0; border:1px solid var(--border); border-radius:6px;
               cursor:pointer; color:var(--sub); }
  .day input[type=checkbox] { position:absolute; opacity:0; }
  .day input[type=checkbox]:checked + label { background:rgba(96,165,250,.18);
                                              border-color:var(--accent); color:var(--text); }
  .day input[type=checkbox]:focus-visible + label { outline:2px solid var(--accent); }
  .day input[type=number] { margin-top:6px; padding:6px 0; text-align:center; appearance:textfield;
                            -moz-appearance:textfield; }
  table.rungs { width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums; }
  table.rungs th, table.rungs td { padding:8px 6px; text-align:right; border-top:1px solid var(--border); }
  table.rungs th { color:var(--sub); font-weight:500; font-size:12px; border-top:0; }
  table.rungs th:first-child, table.rungs td:first-child { text-align:left; font-weight:600; }
  td.chg { background:rgba(251,191,36,.12); }
  td.chg .was { color:var(--sub); text-decoration:line-through; margin-right:4px; }
  .scroll { overflow-x:auto; }
  .obs { display:flex; flex-wrap:wrap; gap:8px 24px; color:var(--sub); font-size:13px; margin-bottom:12px; }
  .obs b { color:var(--text); font-weight:600; }
  a.btnlink { text-decoration:none; }
  .goalrow { display:grid; grid-template-columns:minmax(0,1fr) 150px 170px 36px; gap:8px; margin-bottom:8px; align-items:center; }
  .goalrow button.x { padding:6px 0; font-size:18px; line-height:1; }
  .inline-actions { display:flex; gap:8px; margin-top:4px; }
  @media (max-width:620px) {
    .goalrow { grid-template-columns:minmax(0,1fr) minmax(0,1fr) 36px; }
    .goalrow input[type=text] { grid-column:1 / -1; }
  }
  .badge { display:inline-block; min-width:18px; margin-left:6px; padding:0 5px; border-radius:9px; background:var(--warn);
           color:#111827; font-size:11px; font-weight:700; text-align:center; line-height:18px; }
  .duepanel { display:grid; gap:12px; margin-bottom:16px; }
  .duecard { background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--border); border-radius:10px;
             padding:12px 16px; margin-bottom:12px; }
  .duepanel .duecard { margin-bottom:0; }
  .duecard.due { border-left-color:var(--warn); } .duecard.overdue { border-left-color:var(--bad); }
  .duecard.ok { border-left-color:var(--ok); }
  .duehead { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:4px; }
  .duecard .hint { color:var(--sub); font-size:13px; margin:2px 0 8px; }
  .duecard textarea { margin:4px 0 8px; }
  .pill { font-size:12px; padding:1px 9px; border-radius:10px; border:1px solid var(--border); color:var(--sub); }
  .pill.due { border-color:var(--warn); color:var(--warn); } .pill.overdue { border-color:var(--bad); color:var(--bad); }
  .pill.ok { border-color:var(--ok); color:var(--ok); }
  details.memory { margin-bottom:16px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 16px; }
  details.memory summary { cursor:pointer; font-weight:600; font-size:14px; }
  details.memory[open] summary { margin-bottom:8px; }
  .note { border-top:1px solid var(--border); padding:10px 0; }
  .note.shown .notehead span:first-child { color:var(--text); }
  .notehead { display:flex; justify-content:space-between; gap:8px; align-items:center; color:var(--sub); font-size:12px; margin-bottom:4px; }
  .notebody { font-size:14px; } .notebody textarea { width:100%; }
  .coachbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  .coachbar select { width:auto; min-width:0; flex:1 1 160px; max-width:360px; }
  .chatlog { display:flex; flex-direction:column; gap:10px; padding-bottom:12px; min-height:30vh; }
  .bubble { max-width:92%; padding:10px 14px; border-radius:12px; font-size:15px; overflow-wrap:anywhere; }
  .bubble.you { align-self:flex-end; background:rgba(96,165,250,.18); border:1px solid var(--accent); white-space:pre-wrap; }
  .bubble.coach { align-self:flex-start; background:var(--surface); border:1px solid var(--border); }
  .md p { margin:0 0 8px; } .md p:last-child, .md ul:last-child, .md ol:last-child { margin-bottom:0; }
  .md ul, .md ol { margin:0 0 8px; padding-left:22px; } .md li { margin:2px 0; }
  .md h5 { margin:10px 0 4px; font-size:14px; } .md h5:first-child { margin-top:0; }
  code.ic { background:#0b1220; padding:1px 5px; border-radius:4px; font:13px ui-monospace, monospace; }
  .tool { align-self:flex-start; font-size:12px; color:var(--sub); border:1px dashed var(--border); border-radius:10px; padding:3px 10px; }
  .tool small { display:block; color:var(--text); margin-top:2px; }
  .tool.write { border-color:var(--ok); color:var(--ok); }
  .starters { display:flex; flex-direction:column; gap:8px; align-items:flex-start; }
  .starters button { text-align:left; }
  .composer { align-items:flex-end; }
  .composer textarea { flex:1; resize:none; width:auto; }
  .act { margin-top:8px; }
  .act .inline { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .act .inline input { width:auto; min-width:0; flex:1 1 140px; max-width:220px; }
  .act .inline label { display:flex; gap:8px; align-items:center; color:var(--sub); font-size:13px; flex:1 1 200px; }
  .act .hint { color:var(--sub); font-size:13px; margin:8px 0 0; }
  pre.joblog { margin:8px 0 0; padding:8px 10px; background:#0b1220; border-radius:6px; font:12px ui-monospace, monospace;
               color:#d1d5db; overflow-x:auto; max-height:11em; }
  .sev { font-size:12px; padding:1px 9px; border-radius:10px; border:1px solid var(--border); color:var(--sub); white-space:nowrap; }
  .sev.s1 { border-color:var(--accent); color:var(--accent); } .sev.s2 { border-color:var(--warn); color:var(--warn); }
  .sev.s3 { border-color:var(--bad); color:var(--bad); }
  .sig { border-top:1px solid var(--border); padding:10px 0; }
  .sig:first-child { border-top:0; }
  .sig.gone { opacity:.6; }
  .sighead { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; font-size:14px; }
  .sighead .when { color:var(--sub); font-size:13px; }
  .sigq { margin:4px 0 0; font-size:14px; overflow-wrap:anywhere; }
  .sigmeta { color:var(--sub); font-size:12px; margin-top:2px; }
  .sigfilters { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:8px 12px; align-items:end; margin-bottom:12px; }
  .sigfilters label { font-size:13px; color:var(--sub); }
  .sigfilters label.chk { display:flex; gap:8px; align-items:center; padding-bottom:8px; }
  .sigfilters input[type=checkbox] { width:auto; }
  .suggest { align-self:flex-start; max-width:92%; border:1px solid var(--accent); border-radius:12px; padding:10px 14px;
             background:rgba(96,165,250,.08); }
  .suggest .what { font-weight:600; } .suggest .why { color:var(--sub); font-size:14px; margin:4px 0 8px; }
  .adv { margin:6px 0 0; padding:8px 10px; background:#0b1220; border-radius:6px; font-size:13px; color:var(--sub); }
  .adv b { color:var(--text); }
  .hero { display:flex; flex-wrap:wrap; gap:8px 24px; align-items:baseline; }
  .hero .big { font-size:28px; font-weight:700; }
  .hero .sub { color:var(--sub); }
  .rungs-bar { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:6px; margin:14px 0 4px; }
  .pip { text-align:center; padding:6px 0; border-radius:6px; border:1px solid var(--border);
         color:var(--sub); font-size:12px; }
  .pip b { display:block; font-size:13px; color:var(--text); }
  .pip.here { background:rgba(96,165,250,.18); border-color:var(--accent); }
  .pip.passed { background:rgba(255,255,255,.04); }
  .meter { position:relative; height:10px; background:#0b1220; border-radius:5px; margin:10px 0 6px; }
  .meter .fill { position:absolute; inset:0 auto 0 0; background:var(--accent); border-radius:5px; }
  .meter .tick { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--sub); }
  .ticks { position:relative; height:16px; font-size:11px; color:var(--sub); }
  .ticks span { position:absolute; transform:translateX(-50%); white-space:nowrap; }
  .rule { color:var(--sub); font-size:13px; margin:8px 0 0; }
  .rule b { color:var(--text); font-weight:600; }
  h4.wk { margin:18px 0 6px; font-size:13px; color:var(--sub); font-weight:600; }
  h4.wk:first-child { margin-top:0; }
  .sess { display:grid; grid-template-columns:64px 1fr auto; gap:4px 12px; align-items:baseline;
          padding:8px 0; border-top:1px solid var(--border); font-size:14px; }
  .sess .when { color:var(--sub); font-variant-numeric:tabular-nums; }
  .sess .what small { display:block; color:var(--sub); font-size:12px; }
  .sess .min { text-align:right; font-variant-numeric:tabular-nums; }
  .tag { display:inline-block; font-size:11px; padding:1px 7px; border-radius:10px; margin-left:6px;
         border:1px solid var(--border); color:var(--sub); vertical-align:1px; }
  .tag.lock { border-color:var(--warn); color:var(--warn); }
  .tag.cal { border-color:var(--ok); color:var(--ok); }
  .role-strength .what { color:#fb923c; } .role-long .what { color:var(--accent); }
  .role-hard .what { color:#f87171; }
  .outline { display:grid; grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); gap:6px; }
  .wkchip { border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-size:12px; color:var(--sub); }
  .wkchip b { display:block; color:var(--text); font-size:13px; }
  .wkchip.proj { border-style:dashed; }
  .wkchip.rec { background:rgba(52,211,153,.08); }
  .wkchip.now { border-color:var(--accent); background:rgba(96,165,250,.12); }
  .oc { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; }
  .oc.met { background:rgba(52,211,153,.18); color:var(--ok); }
  .oc.partial { background:rgba(251,191,36,.18); color:var(--warn); }
  .oc.missed { background:rgba(248,113,113,.18); color:var(--bad); }
  .goal { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid var(--border); }
  .goal:first-of-type { border-top:0; }
  .pre { white-space:pre-line; color:var(--sub); font-size:13px; }
  button { padding:9px 16px; border-radius:6px; border:1px solid var(--border);
           background:var(--surface); color:var(--text); font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#0b1220;
                   font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  .msg { padding:10px 12px; border-radius:6px; margin:12px 0; font-size:14px; }
  .msg.bad { background:rgba(248,113,113,.12); border:1px solid var(--bad); }
  .msg.good { background:rgba(52,211,153,.12); border:1px solid var(--ok); }
  .msg.note { background:rgba(251,191,36,.10); border:1px solid var(--warn); }
  .bar { position:sticky; bottom:0; padding:12px 0; background:var(--bg); display:flex;
         gap:12px; align-items:center; }
  .toggle { display:flex; gap:10px; align-items:flex-start; }
  .toggle input { margin-top:5px; }
  @media (max-width:520px) { .days { gap:4px; } .day label { font-size:12px; }
    .day input[type=number] { font-size:12px; } }
</style>
</head>
<body>
<header>
  <h1>Fitness Coach</h1>
  <nav aria-label="Main">
    <a href="#plan" data-view="plan">Plan</a>
    <a href="#coach" data-view="coach">Coach</a>
    <a href="#signals" data-view="signals">Signals</a>
    <a href="#setup" data-view="setup">Setup</a>
    <a href="#settings" data-view="settings">Settings</a>
    <a href="#ladder" data-view="ladder">Ladder</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/calendar">Calendar</a>
  </nav>
</header>
<main id="main" aria-live="polite"></main>

<script>
"use strict";
const DAYS = ["mon","tue","wed","thu","fri","sat","sun"];
const FULL = {mon:"Monday",tue:"Tuesday",wed:"Wednesday",thu:"Thursday",fri:"Friday",
              sat:"Saturday",sun:"Sunday"};
const main = document.getElementById("main");

// ---- the write token -------------------------------------------------------------------------
// The server refuses any non-GET without it. It is per server run, so fetch it again on a 403
// rather than trusting a copy that may predate a restart.
let token = null;
async function getToken(force) {
  if (!token || force) token = (await (await fetch("/api/session")).json()).token;
  return token;
}
async function api(method, path, body) {
  const send = async () => fetch(path, {
    method,
    headers: Object.assign({"Content-Type": "application/json"},
      method === "GET" ? {} : {"X-Fitness-Token": await getToken()}),
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let r = await send();
  if (r.status === 403 && method !== "GET") { await getToken(true); r = await send(); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof data.detail === "string" ? data.detail : "request failed (" + r.status + ")");
  return data;
}

// ---- tiny DOM helper: text nodes only, never an HTML string, so a config value cannot inject markup
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null) el.append(kid);
  return el;
}

// The checks whose fix is "derive the ladder again", which this page can do.
const LADDER_CHECKS = ["tier ladder", "week", "limits"];

// ---- setup ------------------------------------------------------------------------------------
// The first-run steps that used to be a command to paste. Each does what the command did, through
// the same code, and then re-runs the checklist. The command stays visible beside it.
function busyButton(label, onclick, cls) {
  const b = h("button", {class: cls || "primary"}, label);
  b.addEventListener("click", async () => {
    b.disabled = true;
    try { await onclick(); } finally { b.disabled = false; }
  });
  return b;
}

function rowAction(c) {
  const out = h("div", {class: "act"});
  // Messages go in their own slot, below the controls. Replacing the whole row would delete the
  // input and button along with the old message, so a typo would leave nothing to retry with.
  const status = h("div", {});
  const say = (cls, text) => status.replaceChildren(h("div", {class: "msg " + cls, role: cls === "bad" ? "alert" : null}, text));

  if (c.name === "database") {
    out.append(busyButton("Set up the database", async () => {
      try { await api("POST", "/api/database"); await setupView(); } catch (e) { say("bad", e.message); }
    }));
  } else if (c.name === "history") {
    const since = h("input", {type: "date", value: "2017-01-01", "aria-label": "Fetch history from"});
    const log = h("pre", {class: "joblog", hidden: true});
    const go = busyButton("Fetch my history", async () => {
      try {
        let s = await api("POST", "/api/history", {start: since.value || null});
        log.hidden = false;
        while (s.running) {
          log.textContent = s.log.slice(-8).join("\n") || "Starting…";
          await new Promise(r => setTimeout(r, 1500));
          s = await api("GET", "/api/history");
        }
        log.textContent = s.log.slice(-8).join("\n");
        if (s.error) { say("bad", s.error); return; }
        const r = s.result;
        say(r.errors ? "note" : "good", "Fetched " + r.activities + " activities and " + r.wellness + " wellness days" +
            (r.errors ? ", with " + r.errors + " window(s) that failed. Run it again to retry them." : "."));
        setTimeout(setupView, 1500);
      } catch (e) { say("bad", e.message); }
    });
    out.append(h("div", {class: "inline"}, h("label", {}, "from ", since), go),
      h("p", {class: "hint"}, "Pulls your riding, sleep and HRV from intervals.icu. Nine years takes a few minutes; you can leave this page open."), log);
  } else if (c.name === "ftp") {
    const watts = h("input", {type: "number", min: 50, max: 600, step: 1, placeholder: "watts", "aria-label": "FTP in watts"});
    out.append(h("div", {class: "inline"}, watts, busyButton("Save FTP", async () => {
      if (!watts.value) { say("bad", "Enter your FTP in watts."); return; }
      try { await api("POST", "/api/profile/ftp", {watts: Number(watts.value)}); await setupView(); }
      catch (e) { say("bad", e.message); }
    })), h("p", {class: "hint"}, "Recorded as of today. Later changes are new dated entries, so your earlier rides keep the FTP they were scored against."));
  } else if (c.name === "plan") {
    out.append(busyButton("Build my plan", async () => {
      say("note", "Working…");
      try {
        const r = await api("POST", "/api/plan/regenerate");
        say(r.errors.length ? "bad" : "good", r.summary);
        setTimeout(setupView, 1500);
      } catch (e) { say("bad", e.message); }
    }), h("p", {class: "hint"}, "Writes your next three weeks to this app only. Nothing goes to your intervals.icu calendar from here."));
  } else if (c.name === "config") {
    out.append(h("a", {href: "#settings", class: "btnlink"}, h("button", {class: "primary"}, "Open settings")));
  } else if (c.name === "calendar") {
    out.append(h("a", {href: "#settings", class: "btnlink"}, h("button", {}, "Open settings")),
      h("p", {class: "hint"}, "The calendar push is off until you turn it on there. Look at your plan first."));
  } else if (c.name === "secrets") {
    out.append(h("p", {class: "hint"}, "Your intervals.icu key goes in the .env file, not on this page: a secret typed into a web page is one more place it can leak."));
  } else { return null; }
  out.append(status);
  return out;
}

async function setupView() {
  main.replaceChildren(h("p", {class: "lede"}, "Checking…"));
  const s = await api("GET", "/api/setup");
  const firstOpen = s.checks.findIndex(c => !c.ok && c.blocking);
  main.replaceChildren(
    h("h2", {}, s.ready ? "You are set up" : "Finish setting up"),
    h("p", {class: "lede"}, s.ready
      ? "Everything the plan needs is in place. Anything marked below is worth a look, not a blocker."
      : "These run in order; the first open step is the one to do next."),
    h("div", {class: "card"}, s.checks.map((c, i) => {
      const cls = c.ok ? "ok" : (!c.blocking ? "warn" : (i === firstOpen ? "next" : "warn"));
      return h("div", {class: "row"},
        h("div", {class: "mark " + cls, "aria-hidden": "true"},
          c.ok ? "✓" : (c.blocking ? String(i + 1) : "!")),
        h("div", {},
          h("div", {class: "name"}, c.name + (c.ok ? "" : (c.blocking ? " (to do)" : " (worth a look)"))),
          h("div", {class: "detail"}, c.detail),
          !c.ok && c.fix ? h("code", {}, c.fix) : null,
          !c.ok && LADDER_CHECKS.includes(c.name)
            ? h("a", {href: "#ladder", class: "btnlink"}, h("button", {class: "primary"}, "Review the ladder")) : null,
          !c.ok ? rowAction(c) : null));
    })),

// Goals live in the database, not the config file, because the coach edits them too. They save on
// their own button: they are not part of the settings form.
const PRIORITY_LABEL = {primary: "Primary", secondary: "Secondary", opt_in: "Opt-in"};

function goalsCard(initial) {
  let rows = initial.goals.map(g => ({id: g.id, description: g.description, date: g.date || "", priority: g.priority}));
  const list = h("div", {});
  const status = h("div", {});
  const draw = () => list.replaceChildren(...rows.map((g, i) => {
    const text = h("input", {type: "text", value: g.description, placeholder: "What are you working toward?", "aria-label": "Goal " + (i + 1)});
    text.addEventListener("input", () => { g.description = text.value; });
    const date = h("input", {type: "date", value: g.date, "aria-label": "Date for goal " + (i + 1)});
    date.addEventListener("input", () => { g.date = date.value; });
    const prio = h("select", {"aria-label": "Priority for goal " + (i + 1)},
      initial.priorities.map(p => h("option", {value: p, selected: g.priority === p}, PRIORITY_LABEL[p] || p)));
    prio.addEventListener("change", () => { g.priority = prio.value; });
    const del = h("button", {type: "button", class: "x", "aria-label": "Remove goal " + (i + 1), title: "Remove"}, "×");
    del.addEventListener("click", () => { rows.splice(i, 1); draw(); });
    return h("div", {class: "goalrow"}, text, date, prio, del);
  }));
  draw();
  const add = h("button", {type: "button"}, "Add a goal");
  add.addEventListener("click", () => { rows.push({id: null, description: "", date: "", priority: "secondary"}); draw(); });
  const save = h("button", {class: "primary"}, "Save goals");
  save.addEventListener("click", async () => {
    save.disabled = true;
    try {
      const out = await api("PUT", "/api/goals", {goals: rows.filter(g => g.description.trim() || g.id !== null)
        .map(g => ({id: g.id, description: g.description, date: g.date || null, priority: g.priority}))});
      rows = out.goals.map(g => ({id: g.id, description: g.description, date: g.date || "", priority: g.priority}));
      draw();
      status.replaceChildren(h("div", {class: "msg good"}, "Goals saved. The coach sees the same list."));
    } catch (e) {
      status.replaceChildren(h("div", {class: "msg bad", role: "alert"}, e.message));
    } finally { save.disabled = false; }
  });
  return h("div", {class: "card"}, h("h3", {}, "Goals"),
    h("p", {class: "hint"}, "Primary goals shape the season. Opt-in goals are events you may do but the plan does not taper for. The coach can add and change these in conversation too, so this is the same list."),
    list, h("div", {class: "inline-actions"}, add, save), status);
}

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WEEKDAY = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
// Dates arrive as YYYY-MM-DD and are read as calendar dates, not instants, so no timezone can
// move them a day.
function parts(iso) { const [y, m, d] = iso.split("-").map(Number); return {y, m, d}; }
function fmt(iso) { const p = parts(iso); return MONTHS[p.m - 1] + " " + p.d; }
function dow(iso) { const p = parts(iso); return WEEKDAY[(new Date(Date.UTC(p.y, p.m - 1, p.d)).getUTCDay() + 6) % 7]; }
function mondayOf(iso) {
  const p = parts(iso); const t = new Date(Date.UTC(p.y, p.m - 1, p.d));
  t.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7));
  return t.toISOString().slice(0, 10);
}
const ROLE = {long: "Long ride", hard: "Hard ride", lit: "Easy ride", strength: "Lift"};

function why(o) {
  if (o.seeded_from === "pre-plan replay" && o.decided_weeks === 0)
    return "This is your starting rung, set from how you were riding before the plan began. The first real decision comes when week 1 closes on Monday.";
  return o.reason;
}

// ---- signals ------------------------------------------------------------------------------------
// Everything the athlete has told the coach, filed from their own words. A wrong one is set aside
// (kept, with a reason) rather than deleted, and the coach stops being told it at once.
const SOURCE = {conversation: "conversation", feel_note: "feel log", ride_note: "ride note", life_event: "life event",
                coach_tool: "told to the coach", manual: "entered by hand"};
async function signalsView() {
  const kind = h("select", {"aria-label": "Kind"}, h("option", {value: ""}, "Any kind"));
  const sev = h("select", {"aria-label": "Severity"}, ...[["0", "Any severity"], ["1", "Worth knowing and up"], ["2", "Affecting training and up"], ["3", "Needs action"]]
    .map(([v, l]) => h("option", {value: v}, l)));
  const topic = h("input", {type: "text", "aria-label": "Topic contains", placeholder: "e.g. knee"});
  const gone = h("input", {type: "checkbox", id: "sigGone"});
  const list = h("div", {}), digest = h("p", {class: "hint"}), cut = h("p", {class: "hint"});
  let kindsLoaded = false;
  async function load() {
    const q = new URLSearchParams({min_severity: sev.value, dismissed: gone.checked ? "true" : "false"});
    if (kind.value) q.set("kind", kind.value); if (topic.value.trim()) q.set("topic", topic.value.trim());
    let d; try { d = await api("GET", "/api/signals?" + q); } catch (e) { list.replaceChildren(h("div", {class: "msg bad", role: "alert"}, e.message)); return; }
    if (!kindsLoaded) { kind.append(...d.kinds.map(k => h("option", {value: k}, k.replace(/_/g, " ")))); kindsLoaded = true; }
    digest.textContent = d.digest;
    cut.textContent = d.truncated ? "Showing the newest " + d.rows.length + " of " + d.total + "." : "";
    list.replaceChildren(...(d.rows.length ? d.rows.map(row) : [h("p", {class: "hint"},
      "Nothing here. Signals are filed when a conversation ends, from what you said about how you are.")]));
  }
  function row(r) {
    const msg = h("div", {}), actions = h("div", {class: "inline-actions"});
    if (r.dismissed_at) {
      const back = h("button", {type: "button"}, "Restore");
      back.addEventListener("click", async () => { try { await api("POST", "/api/signals/" + r.id + "/restore"); await load(); } catch (e) { msg.replaceChildren(h("div", {class: "msg bad", role: "alert"}, e.message)); } });
      actions.append(back);
    } else {
      const set = h("button", {type: "button"}, "That is wrong");
      set.addEventListener("click", () => {
        const why = h("input", {type: "text", placeholder: "Why? (optional)", "aria-label": "Reason"});
        const ok = h("button", {class: "primary", type: "button"}, "Set aside"), no = h("button", {type: "button"}, "Cancel");
        ok.addEventListener("click", async () => { try { await api("POST", "/api/signals/" + r.id + "/dismiss", {reason: why.value}); await load(); } catch (e) { msg.replaceChildren(h("div", {class: "msg bad", role: "alert"}, e.message)); } });
        no.addEventListener("click", () => actions.replaceChildren(set));
        actions.replaceChildren(why, ok, no); why.focus();
      });
      actions.append(set);
    }
    return h("div", {class: "sig" + (r.dismissed_at ? " gone" : "")},
      h("div", {class: "sighead"}, h("span", {class: "sev s" + r.severity}, SOURCE_SEV[r.severity]), h("b", {}, r.kind.replace(/_/g, " ") + (r.topic ? " · " + r.topic : "")),
        h("span", {class: "when"}, r.on_date + (r.end_date ? " to " + r.end_date : "") + " · " + r.state)),
      r.quote ? h("p", {class: "sigq"}, "“" + r.quote + "”") : null,
      h("div", {class: "sigmeta"}, "From your " + (SOURCE[r.source] || r.source) + (r.dismissed_at ? " · set aside" + (r.dismissed_reason ? ": " + r.dismissed_reason : "") : "")),
      actions, msg);
  }
  for (const c of [kind, sev, gone]) c.addEventListener("change", load);
  topic.addEventListener("input", () => { clearTimeout(topic._t); topic._t = setTimeout(load, 250); });
  main.replaceChildren(h("h2", {}, "What you have told the coach"),
    h("p", {class: "lede"}, "Filed automatically from your own words when a conversation ends, so it can be wrong. Set aside anything that is, and the coach stops being told it."),
    h("div", {class: "card"}, digest,
      h("div", {class: "sigfilters"}, h("label", {}, "Kind", kind), h("label", {}, "Severity", sev), h("label", {}, "Topic", topic),
        h("label", {class: "chk", for: "sigGone"}, gone, "Include set aside")),
      list, cut));
  await load();
}

  calculate_ramp_target: "Worked out a ramp target",
  log_life_event: "Saved a life event",
  log_subjective_feel: "Saved how you feel",
  update_goal: "Updated your goals",
};
// Tools that change something. They are marked, and what they did is shown, so a change made in
// conversation is never invisible.
const WRITES = new Set(["log_life_event", "log_subjective_feel", "update_goal"]);
const STARTERS = [
  "How is my week going?",
  "Why am I on this rung, and what moves me up?",
  "What should I focus on this week?",
  "I am feeling run down. What should I change?",
];
const SESSION_KEY = "fc.coach.session";
function remembered() { try { return localStorage.getItem(SESSION_KEY); } catch (e) { return null; } }
function remember(id) { try { id ? localStorage.setItem(SESSION_KEY, id) : localStorage.removeItem(SESSION_KEY); } catch (e) {} }

// Inline: **bold**, *italic*, `code`. Block: # headings, - / * / 1. lists, blank-line paragraphs.
function inline(text) {
  const out = []; const re = /(\*\*[^*]+\*\*|`[^`]+`|\*[^*\s][^*]*\*)/g; let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push(text.slice(last, m.index));
    const t = m[0];
    out.push(t.startsWith("**") ? h("strong", {}, t.slice(2, -2)) : t.startsWith("`") ? h("code", {class: "ic"}, t.slice(1, -1)) : h("em", {}, t.slice(1, -1)));
    last = m.index + t.length;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}
function markdown(text) {
  const box = h("div", {class: "md"}); let list = null, para = [];
  const flush = () => { if (para.length) { box.append(h("p", {}, inline(para.join(" ")))); para = []; } };
  for (const raw of text.split("\n")) {
    const line = raw.trimEnd(); let m;
    if (!line.trim()) { flush(); list = null; continue; }
    if ((m = line.match(/^#{1,4}\s+(.*)$/))) { flush(); list = null; box.append(h("h5", {}, inline(m[1]))); continue; }
    if ((m = line.match(/^\s*([-*]|\d+[.)])\s+(.*)$/))) {
      flush(); const ordered = /\d/.test(m[1]);
      if (!list || list.ordered !== ordered) { list = {el: h(ordered ? "ol" : "ul", {}), ordered}; box.append(list.el); }
      list.el.append(h("li", {}, inline(m[2]))); continue;
    }
    list = null; para.push(line.trim());
  }
  flush(); return box;
}

async function streamAsk(body, on) {
  const r = await fetch("/api/chat/ask", {method: "POST",
    headers: {"Content-Type": "application/json", "X-Fitness-Token": await getToken()},
    body: JSON.stringify(body)});
  if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(typeof d.detail === "string" ? d.detail : "request failed (" + r.status + ")"); }
  const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
  for (;;) {
    const {done, value} = await reader.read(); if (done) break;
    buf += dec.decode(value, {stream: true});
    const frames = buf.split("\n\n"); buf = frames.pop();
    for (const f of frames) if (f.startsWith("data: ")) { try { on(JSON.parse(f.slice(6))); } catch (e) {} }
  }
}

async function coachView() {
  main.replaceChildren(h("p", {class: "lede"}, "Loading…"));
  const st = await api("GET", "/api/chat/status");
  const head = [h("h2", {}, "Coach"), h("p", {class: "lede"}, st.available
    ? "Ask about your week, your plan, or how you are feeling. It reads your training data and can record things you tell it."
    : "The coach is not available right now.")];
  if (!st.available) {
    main.replaceChildren(...head, h("div", {class: "msg note"}, !st.enabled
      ? "It is switched off (coach.enabled is false in your config)."
      : "It needs an Anthropic API key: add ANTHROPIC_API_KEY to your .env file and restart the server. The key stays out of this page on purpose."));
    return;
  }

  let sessionId = remembered(), busy = false;
  const log = h("div", {class: "chatlog", "aria-live": "polite"});
  const box = h("textarea", {rows: 2, placeholder: "Ask the coach…", "aria-label": "Message to the coach"});
  const send = h("button", {class: "primary"}, "Send");
  const picker = h("select", {"aria-label": "Past conversations"});
  const fresh = h("button", {}, "New conversation");
  const finish = h("button", {hidden: true}, "End conversation");
  // A closed conversation is read-only: it can be reopened to read, never continued, so a
  // check-in stays one event rather than a thread that grows for ever.
  let closed = false;
  const closedNote = h("div", {class: "msg note", hidden: true, role: "status"},
    "This conversation has ended. Start a new one to keep talking. ");
  const startOver = h("button", {class: "primary", type: "button"}, "Start a new conversation");
  closedNote.append(startOver);
  function setClosed(on) {
    closed = on;
    box.disabled = on; send.disabled = on || busy;
    closedNote.hidden = !on;
    finish.hidden = on || !sessionId || !log.querySelector(".bubble");
  }

  const bubble = (who, ...kids) => h("div", {class: "bubble " + who}, ...kids);
  const toBottom = () => { const el = document.scrollingElement; el.scrollTop = el.scrollHeight; };
  const nearBottom = () => { const el = document.scrollingElement; return el.scrollHeight - el.scrollTop - innerHeight < 160; };
  const empty = () => log.replaceChildren(h("div", {class: "starters"},
    h("p", {class: "hint"}, "Try one of these, or ask anything:"),
    STARTERS.map(q => { const b = h("button", {type: "button"}, q); b.addEventListener("click", () => ask(q)); return b; })));

  function chip(name, input) {
    const write = WRITES.has(name);
    const el = h("div", {class: "tool" + (write ? " write" : "")}, h("span", {}, (TOOL_LABEL[name] || name) + "…"));
    el.dataset.name = name; return el;
  }
  // A change the coach offers. Nothing has happened: Apply goes through the same validated
  // settings route as the Settings screen, and the new ladder is reviewed on its own screen.
  function suggestionCard(s) {
    const msg = h("div", {}), actions = h("div", {class: "inline-actions"});
    const card = h("div", {class: "suggest"},
      h("div", {class: "what"}, "Suggested: " + s.label + " " + s.from + " → " + s.to),
      h("p", {class: "why"}, s.reason), actions, msg);
    const apply = h("button", {class: "primary", type: "button"}, "Apply"), no = h("button", {type: "button"}, "Not now");
    apply.addEventListener("click", async () => {
      apply.disabled = true;
      try {
        await api("PUT", "/api/settings", {changes: {[s.setting]: s.to}});
        actions.replaceChildren(h("a", {href: "#ladder", class: "btnlink"}, h("button", {class: "primary", type: "button"}, "Review your ladder")));
        msg.replaceChildren(h("p", {class: "why"}, "Saved. Your ladder has not changed yet: review what it would do first."));
      } catch (e) { apply.disabled = false; msg.replaceChildren(h("div", {class: "msg bad", role: "alert"}, e.message)); }
    });
    no.addEventListener("click", () => card.remove());
    actions.append(apply, no);
    return card;
  }
  function finishChip(el, result) {
    const name = el.dataset.name, write = WRITES.has(name);
    const span = el.querySelector("span"); span.textContent = TOOL_LABEL[name] || name;
    if (write && result) el.append(h("small", {}, String(result).slice(0, 200)));
  }

  // One path for every kind of turn. A conversation question continues the open session; a
  // check-in or block review always starts a new one, and the server records it when it works.
  async function run(label, body, structured) {
    if (busy || (!structured && !body.question.trim())) return;
    busy = true; send.disabled = true; box.value = ""; lockStarts(true);
    if (structured) { sessionId = null; closed = false; remember(null); log.replaceChildren(); }
    else if (log.querySelector(".starters")) log.replaceChildren();
    log.append(bubble("you", label));
    let text = "", answer = null, chips = [], current = null, statusLine = null;
    const paint = () => { if (!answer) { answer = bubble("coach"); log.append(answer); } answer.replaceChildren(markdown(text)); };
    try {
      await streamAsk(Object.assign({session_id: structured ? null : sessionId}, body), ev => {
        const stick = nearBottom();
        if (ev.type === "session") { sessionId = ev.session_id; remember(sessionId); }
        else if (ev.type === "status") { statusLine = statusLine || h("div", {class: "tool"}); statusLine.textContent = ev.text; log.append(statusLine); }
        else if (ev.type === "recorded") { log.append(h("div", {class: "tool write"}, ev.what === "checkin" ? "Recorded as this week's check-in" : "Block review filed")); }
        else if (ev.type === "text") { if (statusLine) { statusLine.remove(); statusLine = null; } text += ev.text; paint(); }
        else if (ev.type === "tool_start") { current = chip(ev.name, ev.input); chips.push(current); log.append(current); answer = null; text = ""; }
        else if (ev.type === "tool_end") { const c = chips.find(x => x.dataset.name === ev.name && !x.dataset.done) || current; if (c) { c.dataset.done = "1"; finishChip(c, ev.result); }
          if (ev.name === "suggest_change") { let s = null; try { s = JSON.parse(ev.result); } catch (e) {} if (s && s.status === "shown") log.append(suggestionCard(s)); } }
        else if (ev.type === "error") { log.append(h("div", {class: "msg bad", role: "alert"}, ev.message)); }
        if (stick) toBottom();
      });
      if (!text && !answer && !chips.length) log.append(h("div", {class: "msg note"}, "The coach sent no reply."));
    } catch (e) {
      log.append(h("div", {class: "msg bad", role: "alert"}, e.message));
      if (/has ended/.test(e.message)) closed = true;      // it closed while the page was open
    } finally { busy = false; lockStarts(false); setClosed(closed); loadPast(); refreshDue(); }
  }
  const ask = q => run(q, {question: q}, false);

  // ---- when a check-in is due -----------------------------------------------------------------
  const duePanel = h("div", {class: "duepanel"});
  const startButtons = [];
  const lockStarts = on => startButtons.forEach(b => { b.disabled = on; });
  const PILL = {ok: "Up to date", due: "Due", overdue: "Overdue"};
  function dueCard(title, s, actions) {
    return h("div", {class: "duecard " + s.state},
      h("div", {class: "duehead"}, h("b", {}, title), h("span", {class: "pill " + s.state}, PILL[s.state] || s.state)),
      s.reasons.map(r => h("p", {class: "hint"}, r)), actions);
  }
  async function refreshDue() {
    let d; try { d = await api("GET", "/api/chat/due"); } catch (e) { return; }
    setNavBadge(d.attention);
    startButtons.length = 0;
    const c = d.checkin, r = d.review;
    const note = h("textarea", {rows: 2, placeholder: "Anything the coach should know first? (optional)", "aria-label": "Note for the check-in"});
    const go = h("button", {class: c.state === "ok" ? "" : "primary"}, c.state === "ok" ? "Check in anyway" : "Start check-in");
    go.addEventListener("click", () => run("Weekly check-in", {mode: "checkin", note: note.value.trim() || null}, true));
    startButtons.push(go);
    const last = h("p", {class: "hint"}, c.last_date ? "Last check-in: " + c.last_date + " (" + c.days_since + " day" + (c.days_since === 1 ? "" : "s") + " ago)." : "No check-in recorded yet.");
    const cards = [dueCard("Weekly check-in", c, [last, note, go])];
    if (r.state !== "ok" || r.next_close) {
      const acts = [];
      if (r.state !== "ok") {
        const rb = h("button", {class: "primary"}, "Start block review");
        rb.addEventListener("click", () => run("Block review", {mode: "cycle_review"}, true));
        startButtons.push(rb); acts.push(rb);
      }
      cards.push(dueCard("Block review", r, acts));
    }
    duePanel.replaceChildren(...cards);
    lockStarts(busy);
  }

  function showHistory(messages) {
    log.replaceChildren();
    for (const m of messages) {
      if (m.role === "user" && typeof m.content === "string") log.append(bubble("you", m.content));
      else if (Array.isArray(m.content)) for (const b of m.content) {
        if (m.role === "assistant" && b.type === "text" && b.text) log.append(bubble("coach", markdown(b.text)));
        else if (b.type === "tool_use") { const c = chip(b.name, b.input); finishChip(c, null); log.append(c); }
        else if (m.role === "assistant" && typeof b === "string") log.append(bubble("coach", markdown(b)));
      }
      else if (m.role === "assistant" && typeof m.content === "string") log.append(bubble("coach", markdown(m.content)));
    }
    if (!log.children.length) empty();
  }

  async function open(id, scroll = true) {
    sessionId = id || null; remember(sessionId);
    if (!id) { empty(); picker.value = ""; setClosed(false); return; }
    try {
      const detail = await api("GET", "/api/chat/sessions/" + id);
      showHistory(detail.messages); if (scroll) toBottom();
      setClosed(detail.closed);
    } catch (e) { sessionId = null; remember(null); empty(); setClosed(false); }
  }

  async function loadPast() {
    try {
      const list = await api("GET", "/api/chat/sessions?limit=25");
      picker.replaceChildren(h("option", {value: ""}, list.length ? "Past conversations…" : "No past conversations"),
        ...list.map(s => h("option", {value: s.session_id, selected: s.session_id === sessionId},
          (s.title || "Untitled") + " · " + (s.updated_at || "").slice(0, 10))));
      picker.disabled = !list.length;
    } catch (e) { /* the list is a convenience; the chat works without it */ }
  }

  // ---- what the coach remembers ---------------------------------------------------------------
  // The notes the coach is briefed from, shown as it is given them, so a wrong one can be fixed.
  const memList = h("div", {});
  const memBox = h("details", {class: "memory"}, h("summary", {}, "What the coach remembers"), memList);
  const KIND = {session_summary: "Conversation note", checkin: "Check-in"};
  async function loadMemory() {
    let m; try { m = await api("GET", "/api/chat/memory"); } catch (e) { return; }
    memList.replaceChildren(
      h("p", {class: "hint"}, "These are the notes the coach reads before it speaks to you. The ones marked are in its briefing right now; older ones are kept but not read. Correct or remove anything that is wrong."),
      ...(m.entries.length ? m.entries.map(noteCard) : [h("p", {class: "hint"}, "Nothing yet. A note is written when a conversation ends.")]));
  }
  function noteCard(e) {
    const body = h("div", {class: "notebody"}, markdown(e.content));
    const msg = h("div", {});
    const actions = h("div", {class: "inline-actions"});
    if (e.editable) {
      const edit = h("button", {type: "button"}, "Edit"), forget = h("button", {type: "button"}, "Forget");
      edit.addEventListener("click", () => {
        const area = h("textarea", {rows: 5, "aria-label": "Edit note"}, e.content);
        const save = h("button", {class: "primary", type: "button"}, "Save"), cancel = h("button", {type: "button"}, "Cancel");
        save.addEventListener("click", async () => {
          try { await api("PUT", "/api/chat/memory/" + e.id, {content: area.value}); await loadMemory(); }
          catch (err) { msg.replaceChildren(h("div", {class: "msg bad", role: "alert"}, err.message)); }
        });
        cancel.addEventListener("click", loadMemory);
        body.replaceChildren(area); actions.replaceChildren(save, cancel);
      });
      forget.addEventListener("click", async () => {
        if (!confirm("Make the coach forget this note? The conversation itself is kept.")) return;
        try { await api("DELETE", "/api/chat/memory/" + e.id); await loadMemory(); }
        catch (err) { msg.replaceChildren(h("div", {class: "msg bad", role: "alert"}, err.message)); }
      });
      actions.append(edit, forget);
    }
    return h("div", {class: "note" + (e.shown ? " shown" : "")},
      h("div", {class: "notehead"}, h("span", {}, e.date + " · " + (KIND[e.type] || e.type)),
        e.shown ? h("span", {class: "pill ok"}, "in its briefing") : h("span", {class: "pill"}, "kept, not read")),
      body, actions, msg);
  }
  memBox.addEventListener("toggle", () => { if (memBox.open) loadMemory(); });

  // Leaving a conversation is what ends it: the previous one is noted in the background.
  function endCurrent() {
    if (!sessionId || !log.querySelector(".bubble")) return;
    api("POST", "/api/chat/sessions/" + sessionId + "/end").catch(() => {});
    setTimeout(() => { if (memBox.open) loadMemory(); }, 6000);
  }

  send.addEventListener("click", () => ask(box.value));
  box.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(box.value); } });
  fresh.addEventListener("click", () => { if (!busy) { endCurrent(); open(null); } });
  startOver.addEventListener("click", () => { if (!busy) open(null); });
  finish.addEventListener("click", () => { if (!busy) { endCurrent(); setClosed(true); } });
  picker.addEventListener("change", () => { if (!busy && picker.value) { endCurrent(); open(picker.value); } });

  main.replaceChildren(...head, duePanel, memBox,
    h("div", {class: "coachbar"}, picker, fresh, finish, h("span", {class: "detail"}, st.model)),
    log, closedNote, h("div", {class: "bar composer"}, box, send));
  refreshDue();
  await loadPast();
  // Resume the conversation you were in only if it is still open. A closed one is over: start
  // fresh, and it stays reachable (read-only) from the list of past conversations.
  if (sessionId) {
    try {
      const detail = await api("GET", "/api/chat/sessions/" + sessionId);
      if (detail.closed) { sessionId = null; remember(null); empty(); }
      else { showHistory(detail.messages); setClosed(false); }
    } catch (e) { sessionId = null; remember(null); empty(); }
  } else empty();
  setClosed(false);
}

// ---- ladder -----------------------------------------------------------------------------------
// The tier ladder decides every session for months, so this screen shows what a re-derive would
// change, rung by rung and field by field, before anything is kept.
async function ladderView() {
  main.replaceChildren(h("p", {class: "lede"}, "Working out the ladder…"));
  const p = await api("GET", "/api/ladder");
  const intro = [h("h2", {}, "Tier ladder"),
    h("p", {class: "lede"}, "The rungs the plan climbs, derived from your own riding and held inside your settings.")];
  if (p.error) {
    main.replaceChildren(...intro, h("div", {class: "msg bad", role: "alert"}, p.error),
      h("a", {href: "#settings", class: "btnlink"}, h("button", {}, "Change settings")));
    return;
  }
  const was = {};
  for (const r of (p.stored ? p.stored.rungs : [])) was[r.tier] = r;
  const changed = new Set(p.changes.map(c => c.tier + ":" + c.field));
  const cols = [["rides", "Rides"], ["long_min", "Long ride"], ["hard", "Hard"], ["hard_min", "Hard min"],
                ["lit_min", "Easy ride"]];
  const cell = (r, f) => {
    const td = h("td", {}, String(r[f]));
    if (p.stored && changed.has(r.tier + ":" + f)) {
      td.className = "chg";
      const old = was[r.tier] ? was[r.tier][f] : null;
      td.replaceChildren(old === null ? "" : h("span", {class: "was"}, String(old)), String(r[f]));
    }
    return td;
  };
  const hoursCell = r => {
    const td = h("td", {}, r.hours + "h");
    const old = was[r.tier];
    if (p.stored && (!old || old.hours !== r.hours)) {
      td.className = "chg";
      td.replaceChildren(old ? h("span", {class: "was"}, old.hours + "h") : "", r.hours + "h");
    }
    return td;
  };
  const o = p.observed;
  const status = h("div", {});
  const keep = h("button", {class: "primary", disabled: p.same}, p.stored ? "Use this ladder" : "Keep this ladder");
  keep.addEventListener("click", async () => {
    keep.disabled = true;
    try {
      const out = await api("POST", "/api/ladder", {replace: !!p.stored});
      const regen = h("button", {}, "Rebuild the plan from it");
      const result = h("div", {});
      regen.addEventListener("click", async () => {
        regen.disabled = true;
        result.replaceChildren(h("div", {class: "msg note"}, "Working…"));
        try {
          const r = await api("POST", "/api/plan/regenerate");
          result.replaceChildren(h("div", {class: r.errors.length ? "msg bad" : "msg good"}, r.summary));
        } catch (e) {
          result.replaceChildren(h("div", {class: "msg bad", role: "alert"}, e.message));
        } finally { regen.disabled = false; }
      });
      status.replaceChildren(
        h("div", {class: "msg good"}, "Stored as ladder version " + out.version + ". Weeks already decided keep the version they were graded against."),
        h("p", {class: "hint"}, "Rebuilding rewrites the stored sessions from the next two days on. It does not touch your intervals.icu calendar; that happens on the next sync."),
        regen, result);
    } catch (e) {
      status.replaceChildren(h("div", {class: "msg bad", role: "alert"}, e.message));
      keep.disabled = false;
    }
  });
  main.replaceChildren(...intro,
    h("div", {class: "card"},
      h("h3", {}, p.stored ? "Stored: version " + p.stored.version + ". Re-derived from your history under your current settings:"
                           : "Nothing stored yet. Derived from your history under your current settings:"),
      h("div", {class: "obs"},
        h("span", {}, "recently ", h("b", {}, o.recent_hours + "h a week"), " over ", h("b", {}, o.recent_days + " days")),
        h("span", {}, "longest ", h("b", {}, o.recent_long_min + " min")),
        h("span", {}, "best sustained ", h("b", {}, o.sustained_hours + "h a week"), " since " + o.sustained_since),
        h("span", {}, o.weeks_with_a_ride[0] + " of " + o.weeks_with_a_ride[1] + " weeks with a ride")),
      h("div", {class: "scroll"}, h("table", {class: "rungs"},
        h("thead", {}, h("tr", {}, h("th", {}, "Tier"), cols.map(([, l]) => h("th", {}, l)), h("th", {}, "Week"))),
        h("tbody", {}, p.derived.map(r => h("tr", {}, h("td", {}, "T" + r.tier),
          cols.map(([f]) => cell(r, f)), hoursCell(r)))))),
      p.same ? h("div", {class: "msg good"}, "Nothing would change: the stored ladder is already what these settings produce.") : null,
      !p.same && p.stored ? h("p", {class: "hint"}, "Shaded cells would change, with the stored value struck through.") : null,
      p.notes.map(n => h("div", {class: "msg note"}, n))),
    status,
    h("div", {class: "bar"}, keep));
}

// ---- routing ----------------------------------------------------------------------------------
const views = {plan: planView, coach: coachView, signals: signalsView, setup: setupView, settings: settingsView, ladder: ladderView};
async function route() {
  const name = views[(location.hash || "#plan").slice(1)] ? (location.hash || "#plan").slice(1) : "plan";
  const view = views[name];
  document.querySelectorAll("nav a[data-view]").forEach(a =>
    a.classList.toggle("on", a.dataset.view === name));
  refreshBadge();
  try { await view(); }
  catch (e) { main.replaceChildren(h("div", {class: "msg bad", role: "alert"}, e.message)); }
}
addEventListener("hashchange", route);
route();
