<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitness Coach</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#111827; --surface:#1f2937; --border:#374151; --text:#f9fafb; --sub:#9ca3af;
          --accent:#60a5fa; --ok:#34d399; --warn:#fbbf24; --bad:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.5 Inter, system-ui, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:8px 24px; align-items:center;
           padding:12px 16px; border-bottom:1px solid var(--border); background:var(--surface); }
  header h1 { font-size:16px; margin:0 8px 0 0; }
  nav { display:flex; flex-wrap:wrap; gap:4px; }
  nav a { color:var(--sub); text-decoration:none; padding:6px 12px; border-radius:6px; }
  nav a.on { color:var(--text); background:rgba(255,255,255,.08); }
  nav a:hover { color:var(--text); }
  main { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
  h2 { font-size:20px; margin:0 0 4px; }
  p.lede { color:var(--sub); margin:0 0 20px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:10px;
          padding:16px; margin-bottom:16px; }
  .card h3 { margin:0 0 4px; font-size:15px; }
  .card p.hint { color:var(--sub); font-size:13px; margin:0 0 12px; }
  .row { display:flex; gap:12px; align-items:flex-start; padding:12px 0;
         border-top:1px solid var(--border); }
  .row:first-child { border-top:0; }
  .mark { width:22px; height:22px; flex:none; border-radius:50%; text-align:center;
          font-size:13px; line-height:22px; color:#111827; font-weight:700; }
  .mark.ok { background:var(--ok); } .mark.next { background:var(--accent); }
  .mark.warn { background:var(--warn); }
  .name { font-weight:600; } .detail { color:var(--sub); font-size:14px; }
  code { display:block; margin-top:6px; padding:8px 10px; background:#0b1220; border-radius:6px;
         font:13px ui-monospace, monospace; color:#d1d5db; overflow-x:auto; white-space:pre; }
  label.f { display:block; margin-bottom:12px; font-size:14px; }
  label.f span { display:block; color:var(--sub); font-size:13px; margin-bottom:4px; }
  input[type=text], input[type=number], input[type=date], select, textarea {
    width:100%; padding:8px 10px; background:#0b1220; color:var(--text);
    border:1px solid var(--border); border-radius:6px; font:inherit; }
  input:focus, select:focus, textarea:focus, button:focus-visible {
    outline:2px solid var(--accent); outline-offset:1px; }
  .days { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:8px; }
  .day { position:relative; text-align:center; font-size:13px; }
  .day label { display:block; padding:6px 0; border:1px solid var(--border); border-radius:6px;
               cursor:pointer; color:var(--sub); }
  .day input[type=checkbox] { position:absolute; opacity:0; }
  .day input[type=checkbox]:checked + label { background:rgba(96,165,250,.18);
                                              border-color:var(--accent); color:var(--text); }
  .day input[type=checkbox]:focus-visible + label { outline:2px solid var(--accent); }
  .day input[type=number] { margin-top:6px; padding:6px 0; text-align:center; appearance:textfield;
                            -moz-appearance:textfield; }
  table.rungs { width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums; }
  table.rungs th, table.rungs td { padding:8px 6px; text-align:right; border-top:1px solid var(--border); }
  table.rungs th { color:var(--sub); font-weight:500; font-size:12px; border-top:0; }
  table.rungs th:first-child, table.rungs td:first-child { text-align:left; font-weight:600; }
  td.chg { background:rgba(251,191,36,.12); }
  td.chg .was { color:var(--sub); text-decoration:line-through; margin-right:4px; }
  .scroll { overflow-x:auto; }
  .obs { display:flex; flex-wrap:wrap; gap:8px 24px; color:var(--sub); font-size:13px; margin-bottom:12px; }
  .obs b { color:var(--text); font-weight:600; }
  a.btnlink { text-decoration:none; }
  .hero { display:flex; flex-wrap:wrap; gap:8px 24px; align-items:baseline; }
  .hero .big { font-size:28px; font-weight:700; }
  .hero .sub { color:var(--sub); }
  .rungs-bar { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:6px; margin:14px 0 4px; }
  .pip { text-align:center; padding:6px 0; border-radius:6px; border:1px solid var(--border);
         color:var(--sub); font-size:12px; }
  .pip b { display:block; font-size:13px; color:var(--text); }
  .pip.here { background:rgba(96,165,250,.18); border-color:var(--accent); }
  .pip.passed { background:rgba(255,255,255,.04); }
  .meter { position:relative; height:10px; background:#0b1220; border-radius:5px; margin:10px 0 6px; }
  .meter .fill { position:absolute; inset:0 auto 0 0; background:var(--accent); border-radius:5px; }
  .meter .tick { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--sub); }
  .ticks { position:relative; height:16px; font-size:11px; color:var(--sub); }
  .ticks span { position:absolute; transform:translateX(-50%); white-space:nowrap; }
  .rule { color:var(--sub); font-size:13px; margin:8px 0 0; }
  .rule b { color:var(--text); font-weight:600; }
  h4.wk { margin:18px 0 6px; font-size:13px; color:var(--sub); font-weight:600; }
  h4.wk:first-child { margin-top:0; }
  .sess { display:grid; grid-template-columns:64px 1fr auto; gap:4px 12px; align-items:baseline;
          padding:8px 0; border-top:1px solid var(--border); font-size:14px; }
  .sess .when { color:var(--sub); font-variant-numeric:tabular-nums; }
  .sess .what small { display:block; color:var(--sub); font-size:12px; }
  .sess .min { text-align:right; font-variant-numeric:tabular-nums; }
  .tag { display:inline-block; font-size:11px; padding:1px 7px; border-radius:10px; margin-left:6px;
         border:1px solid var(--border); color:var(--sub); vertical-align:1px; }
  .tag.lock { border-color:var(--warn); color:var(--warn); }
  .tag.cal { border-color:var(--ok); color:var(--ok); }
  .role-strength .what { color:#fb923c; } .role-long .what { color:var(--accent); }
  .role-hard .what { color:#f87171; }
  .outline { display:grid; grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); gap:6px; }
  .wkchip { border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-size:12px; color:var(--sub); }
  .wkchip b { display:block; color:var(--text); font-size:13px; }
  .wkchip.proj { border-style:dashed; }
  .wkchip.rec { background:rgba(52,211,153,.08); }
  .wkchip.now { border-color:var(--accent); background:rgba(96,165,250,.12); }
  .oc { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; }
  .oc.met { background:rgba(52,211,153,.18); color:var(--ok); }
  .oc.partial { background:rgba(251,191,36,.18); color:var(--warn); }
  .oc.missed { background:rgba(248,113,113,.18); color:var(--bad); }
  .goal { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid var(--border); }
  .goal:first-of-type { border-top:0; }
  .pre { white-space:pre-line; color:var(--sub); font-size:13px; }
  button { padding:9px 16px; border-radius:6px; border:1px solid var(--border);
           background:var(--surface); color:var(--text); font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#0b1220;
                   font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  .msg { padding:10px 12px; border-radius:6px; margin:12px 0; font-size:14px; }
  .msg.bad { background:rgba(248,113,113,.12); border:1px solid var(--bad); }
  .msg.good { background:rgba(52,211,153,.12); border:1px solid var(--ok); }
  .msg.note { background:rgba(251,191,36,.10); border:1px solid var(--warn); }
  .bar { position:sticky; bottom:0; padding:12px 0; background:var(--bg); display:flex;
         gap:12px; align-items:center; }
  .toggle { display:flex; gap:10px; align-items:flex-start; }
  .toggle input { margin-top:5px; }
  @media (max-width:520px) { .days { gap:4px; } .day label { font-size:12px; }
    .day input[type=number] { font-size:12px; } }
</style>
</head>
<body>
<header>
  <h1>Fitness Coach</h1>
  <nav aria-label="Main">
    <a href="#plan" data-view="plan">Plan</a>
    <a href="#setup" data-view="setup">Setup</a>
    <a href="#settings" data-view="settings">Settings</a>
    <a href="#ladder" data-view="ladder">Ladder</a>
    <a href="/">Dashboard</a>
    <a href="/calendar">Calendar</a>
  </nav>
</header>
<main id="main" aria-live="polite"></main>

<script>
"use strict";
const DAYS = ["mon","tue","wed","thu","fri","sat","sun"];
const FULL = {mon:"Monday",tue:"Tuesday",wed:"Wednesday",thu:"Thursday",fri:"Friday",
              sat:"Saturday",sun:"Sunday"};
const main = document.getElementById("main");

// ---- the write token -------------------------------------------------------------------------
// The server refuses any non-GET without it. It is per server run, so fetch it again on a 403
// rather than trusting a copy that may predate a restart.
let token = null;
async function getToken(force) {
  if (!token || force) token = (await (await fetch("/api/session")).json()).token;
  return token;
}
async function api(method, path, body) {
  const send = async () => fetch(path, {
    method,
    headers: Object.assign({"Content-Type": "application/json"},
      method === "GET" ? {} : {"X-Fitness-Token": await getToken()}),
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let r = await send();
  if (r.status === 403 && method !== "GET") { await getToken(true); r = await send(); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof data.detail === "string" ? data.detail : "request failed (" + r.status + ")");
  return data;
}

// ---- tiny DOM helper: text nodes only, never an HTML string, so a config value cannot inject markup
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null) el.append(kid);
  return el;
}

// The checks whose fix is "derive the ladder again", which this page can do.
const LADDER_CHECKS = ["tier ladder", "week", "limits"];

// ---- setup ------------------------------------------------------------------------------------
async function setupView() {
  main.replaceChildren(h("p", {class: "lede"}, "Checking…"));
  const s = await api("GET", "/api/setup");
  const firstOpen = s.checks.findIndex(c => !c.ok && c.blocking);
  main.replaceChildren(
    h("h2", {}, s.ready ? "You are set up" : "Finish setting up"),
    h("p", {class: "lede"}, s.ready
      ? "Everything the plan needs is in place. Anything marked below is worth a look, not a blocker."
      : "These run in order; the first open step is the one to do next."),
    h("div", {class: "card"}, s.checks.map((c, i) => {
      const cls = c.ok ? "ok" : (!c.blocking ? "warn" : (i === firstOpen ? "next" : "warn"));
      return h("div", {class: "row"},
        h("div", {class: "mark " + cls, "aria-hidden": "true"},
          c.ok ? "✓" : (c.blocking ? String(i + 1) : "!")),
        h("div", {},
          h("div", {class: "name"}, c.name + (c.ok ? "" : (c.blocking ? " (to do)" : " (worth a look)"))),
          h("div", {class: "detail"}, c.detail),
          !c.ok && c.fix ? h("code", {}, c.fix) : null,
          !c.ok && LADDER_CHECKS.includes(c.name)
            ? h("a", {href: "#ladder", class: "btnlink"}, h("button", {class: "primary"}, "Review the ladder")) : null));
    })),
    h("button", {onclick: setupView}, "Check again"),
    " ",
    h("a", {href: "#settings", class: "btnlink"}, h("button", {}, "Change settings")),
    " ",
    h("a", {href: "#ladder", class: "btnlink"}, h("button", {}, "Review the ladder")));
}

// ---- settings ---------------------------------------------------------------------------------
async function settingsView() {
  main.replaceChildren(h("p", {class: "lede"}, "Loading…"));
  const {values: v} = await api("GET", "/api/settings");
  const limits = v["plan.day_max_ride_min"] || {};
  const open = v["plan.available_days"] || DAYS;

  const f = {};   // dotted config path -> function returning the form's current value for it
  const text = (path, label, hint) => {
    const input = h("input", {type: "text", value: v[path] ?? ""});
    f[path] = () => input.value.trim();
    return h("label", {class: "f"}, h("span", {}, label + (hint ? " — " + hint : "")), input);
  };
  const num = (path, label, hint, min) => {
    const input = h("input", {type: "number", min: min ?? 0, step: 1, value: v[path] ?? ""});
    f[path] = () => input.value.trim() === "" ? null : Number(input.value);
    return h("label", {class: "f"}, h("span", {}, label + (hint ? " — " + hint : "")), input);
  };

  const dayBoxes = {}, dayLimits = {};
  const dayRow = h("div", {class: "days", role: "group", "aria-label": "Days you can train"},
    DAYS.map(d => {
      const box = h("input", {type: "checkbox", id: "d-" + d, checked: open.includes(d)});
      const lim = h("input", {type: "number", min: 30, step: 5, placeholder: "min",
                              "aria-label": FULL[d] + " ride limit in minutes", value: limits[d] ?? ""});
      dayBoxes[d] = box; dayLimits[d] = lim;
      return h("div", {class: "day"}, box, h("label", {for: "d-" + d}, d.toUpperCase()), lim);
    }));
  f["plan.available_days"] = () => {
    const on = DAYS.filter(d => dayBoxes[d].checked);
    return on.length === 7 ? null : on;
  };
  f["plan.day_max_ride_min"] = () => {
    const m = {};
    for (const d of DAYS) if (dayLimits[d].value.trim() !== "") m[d] = Number(dayLimits[d].value);
    return Object.keys(m).length ? m : null;
  };
  const longDay = h("select", {}, h("option", {value: ""}, "Let the plan choose"),
    DAYS.map(d => h("option", {value: d, selected: v["plan.long_ride_day"] === d}, FULL[d])));
  f["plan.long_ride_day"] = () => longDay.value || null;

  const push = h("input", {type: "checkbox", id: "push",
                           checked: v["integrations.intervals_icu.push_calendar"]});
  f["integrations.intervals_icu.push_calendar"] = () => push.checked;

  const notes = h("textarea", {rows: 3}, v["athlete.notes"] || "");
  f["athlete.notes"] = () => notes.value.trim();

  const status = h("div", {});
  const save = h("button", {class: "primary"}, "Save changes");
  save.addEventListener("click", async () => {
    const changes = {};
    for (const [path, read] of Object.entries(f)) {
      const now = read();
      const was = v[path] ?? null;
      if (JSON.stringify(now) !== JSON.stringify(was) && !(now === "" && was === null)) changes[path] = now;
    }
    if (!Object.keys(changes).length) {
      status.replaceChildren(h("div", {class: "msg note"}, "Nothing to save."));
      return;
    }
    save.disabled = true;
    try {
      const out = await api("PUT", "/api/settings", {changes});
      Object.assign(v, out.values);
      const worth = out.checks.filter(c => !c.ok);
      status.replaceChildren(
        h("div", {class: "msg good"}, "Saved. Comments in your config file are kept."),
        worth.length ? h("div", {class: "msg note"}, "Worth a look:",
          worth.map(c => h("div", {}, h("b", {}, c.name + ": "), c.detail)),
          worth.some(c => LADDER_CHECKS.includes(c.name))
            ? h("div", {}, h("a", {href: "#ladder"}, "Review the ladder for these settings")) : null) : null);
    } catch (e) {
      status.replaceChildren(h("div", {class: "msg bad", role: "alert"}, e.message));
    } finally { save.disabled = false; }
  });

  main.replaceChildren(
    h("h2", {}, "Settings"),
    h("p", {class: "lede"}, "These write to config/athlete.yaml. A change that does not fit is refused with the reason, and nothing is saved."),
    h("div", {class: "card"}, h("h3", {}, "You"),
      text("athlete.name", "Name"),
      text("athlete.timezone", "Timezone", "an IANA name such as America/Chicago; it decides what today means"),
      h("label", {class: "f"}, h("span", {}, "Notes for the coach — life load, work, kids"), notes)),
    h("div", {class: "card"}, h("h3", {}, "When you can train"),
      h("p", {class: "hint"}, "Tick the days you can ride or lift on. Under each, an optional limit on the longest ride that day, in minutes."),
      dayRow,
      h("div", {style: "height:16px"}),
      num("plan.max_ride_days", "Most days a week you will ride", "an upper bound; how many you ride is read from your history", 2),
      num("plan.max_ride_min", "Longest any single ride may be, in minutes", "blank for no limit", 30),
      h("label", {class: "f"}, h("span", {}, "Long ride day"), longDay),
      num("plan.strength_days", "Lifting days a week", "never trimmed by a tier", 0)),
    h("div", {class: "card"}, h("h3", {}, "intervals.icu calendar"),
      h("p", {class: "hint"}, "Off by default. When on, each sync writes your next few weeks to your real intervals.icu calendar, and from there to Zwift and Garmin. A second copy of this project pointed at the same account will overwrite the first one's events."),
      h("div", {class: "toggle"}, push, h("label", {for: "push"}, "Push the plan to my intervals.icu calendar"))),
    status,
    h("div", {class: "bar"}, save));
}

// ---- plan -------------------------------------------------------------------------------------
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WEEKDAY = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
// Dates arrive as YYYY-MM-DD and are read as calendar dates, not instants, so no timezone can
// move them a day.
function parts(iso) { const [y, m, d] = iso.split("-").map(Number); return {y, m, d}; }
function fmt(iso) { const p = parts(iso); return MONTHS[p.m - 1] + " " + p.d; }
function dow(iso) { const p = parts(iso); return WEEKDAY[(new Date(Date.UTC(p.y, p.m - 1, p.d)).getUTCDay() + 6) % 7]; }
function mondayOf(iso) {
  const p = parts(iso); const t = new Date(Date.UTC(p.y, p.m - 1, p.d));
  t.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7));
  return t.toISOString().slice(0, 10);
}
const ROLE = {long: "Long ride", hard: "Hard ride", lit: "Easy ride", strength: "Lift"};

function why(o) {
  if (o.seeded_from === "pre-plan replay" && o.decided_weeks === 0)
    return "This is your starting rung, set from how you were riding before the plan began. The first real decision comes when week 1 closes on Monday.";
  return o.reason;
}

async function planView() {
  main.replaceChildren(h("p", {class: "lede"}, "Loading…"));
  const o = await api("GET", "/api/plan/overview");
  if (!o.ready) {
    main.replaceChildren(h("h2", {}, "Plan"), h("div", {class: "msg note"}, o.reason),
      h("a", {href: "#ladder", class: "btnlink"}, h("button", {class: "primary"}, "Go to the ladder")));
    return;
  }
  const t = o.tier, g = o.gate, w = o.this_week;

  const hero = h("div", {class: "card"},
    h("div", {class: "hero"}, h("span", {class: "big"}, "T" + t.index + " · " + t.hours + "h a week"),
      h("span", {class: "sub"}, (o.block || "Plan") + ", week " + o.week_in_block +
        (o.recovery_week ? " · recovery week" : o.week_type !== "normal" ? " · " + o.week_type + " week" : ""))),
    h("p", {class: "hint", style: "margin-top:8px"}, why(o)),
    h("div", {class: "rungs-bar", role: "img", "aria-label": "You are on rung " + t.index + " of " + o.top_tier},
      o.ladder.map(r => h("div", {class: "pip" + (r.index === t.index ? " here" : r.index < t.index ? " passed" : "")},
        h("b", {}, "T" + r.index), r.hours + "h"))),
    h("p", {class: "rule"}, t.rides + " rides: a " + t.long_min + "-minute long ride" +
      (t.hard ? ", a " + t.hard_min + "-minute hard ride" : "") + ", and easy rides of " + t.lit_min + " minutes."));

  const max = Math.max(t.minutes, w.ride_min, 1);
  const pct = n => Math.min(100, n / max * 100) + "%";
  const week = h("div", {class: "card"}, h("h3", {}, "This week, so far"),
    h("p", {class: "hint"}, "Week of " + fmt(w.week_start) + ". Rides logged count; lifts are tracked beside them."),
    h("div", {class: "hero"}, h("span", {class: "big"}, w.ride_min + " min"),
      h("span", {class: "sub"}, w.ride_days + " of " + g.rides + " rides · " + w.strength_sessions + " lift" + (w.strength_sessions === 1 ? "" : "s"))),
    h("div", {class: "meter", role: "img", "aria-label": w.ride_min + " of " + g.met_min + " minutes to move up"},
      h("div", {class: "fill", style: "width:" + pct(w.ride_min)}),
      h("div", {class: "tick", style: "left:" + pct(g.partial_min)}),
      h("div", {class: "tick", style: "left:" + pct(g.met_min)})),
    h("div", {class: "ticks"},
      h("span", {style: "left:" + pct(g.partial_min)}, g.partial_min), h("span", {style: "left:" + pct(g.met_min)}, g.met_min)),
    h("p", {class: "rule"}, h("b", {}, g.met_min + " minutes and " + g.rides + " rides"), " moves you up a rung. ",
      h("b", {}, g.partial_min + "–" + (g.met_min - 1)), " holds you where you are. Under ", g.partial_min,
      " counts as a missed week: one holds you and eases the next week, two in a row step you down."),
    o.outline.summary ? h("p", {class: "pre", style: "margin-top:12px"}, o.outline.summary.split("\n").slice(2).join("\n")) : null);

  const byWeek = new Map();
  for (const s of o.sessions) { const k = mondayOf(s.date); (byWeek.get(k) || byWeek.set(k, []).get(k)).push(s); }
  const horizon = h("div", {class: "card"}, h("h3", {}, "Your next three weeks"),
    h("p", {class: "hint"}, "Sessions from " + fmt(o.frozen_before) + " on are rebuilt on each sync as your riding changes; earlier ones are locked."),
    [...byWeek].map(([monday, list]) => [
      h("h4", {class: "wk"}, "Week of " + fmt(monday) + (monday === w.week_start ? " (this week)" : "")),
      list.map(s => h("div", {class: "sess role-" + s.role},
        h("span", {class: "when"}, dow(s.date) + " " + parts(s.date).d),
        h("span", {class: "what"}, ROLE[s.role] || s.role,
          s.frozen ? h("span", {class: "tag lock"}, "locked") : null,
          s.on_calendar ? h("span", {class: "tag cal"}, "on calendar") : null,
          h("small", {}, s.prescription.split("  (")[0])),
        h("span", {class: "min"}, Math.round(s.minutes) + " min")))]));

  const chips = h("div", {class: "outline"}, o.outline.weeks.map(x =>
    h("div", {class: "wkchip" + (x.projected ? " proj" : "") + (x.week_start === w.week_start ? " now" : "") + (x.recovery ? " rec" : "")},
      h("b", {}, fmt(x.week_start)), x.block + (x.recovery ? " (recovery)" : ""), h("br", {}), "T" + x.tier + " · " + x.hours + "h")));
  const outline = h("div", {class: "card"}, h("h3", {}, "The shape beyond that"),
    h("p", {class: "hint"}, "Dashed weeks are a projection on the assumption “" + o.outline.assumption + "”, not a schedule."), chips);

  const recent = h("div", {class: "card"}, h("h3", {}, "The weeks the plan has looked at"),
    h("p", {class: "hint"}, "Graded against the rung asked for that week. Rides, not lifts."),
    h("div", {class: "scroll"}, h("table", {class: "rungs"},
      h("thead", {}, h("tr", {}, h("th", {}, "Week of"), h("th", {}, "Asked"), h("th", {}, "Rode"), h("th", {}, "Outcome"))),
      h("tbody", {}, [...o.recent].reverse().map(r => h("tr", {}, h("td", {}, fmt(r.week_start)), h("td", {}, "T" + r.tier),
        h("td", {}, Math.round(r.ride_min) + " min · " + r.ride_days + " ride" + (r.ride_days === 1 ? "" : "s")),
        h("td", {}, h("span", {class: "oc " + r.outcome}, r.outcome))))))));

  const goals = o.goals.length ? h("div", {class: "card"}, h("h3", {}, "Goals"),
    o.goals.map(x => h("div", {class: "goal"}, h("span", {}, x.description, h("span", {class: "tag"}, x.priority)),
      h("span", {class: "detail"}, fmt(x.date) + " " + parts(x.date).y + " · " + Math.round(x.days / 7) + " weeks")))) : null;

  main.replaceChildren(h("h2", {}, o.plan_name),
    h("p", {class: "lede"}, "Where you are, what moves you, and what is next."),
    hero, week, horizon, outline, recent, goals);
}

// ---- ladder -----------------------------------------------------------------------------------
// The tier ladder decides every session for months, so this screen shows what a re-derive would
// change, rung by rung and field by field, before anything is kept.
async function ladderView() {
  main.replaceChildren(h("p", {class: "lede"}, "Working out the ladder…"));
  const p = await api("GET", "/api/ladder");
  const intro = [h("h2", {}, "Tier ladder"),
    h("p", {class: "lede"}, "The rungs the plan climbs, derived from your own riding and held inside your settings.")];
  if (p.error) {
    main.replaceChildren(...intro, h("div", {class: "msg bad", role: "alert"}, p.error),
      h("a", {href: "#settings", class: "btnlink"}, h("button", {}, "Change settings")));
    return;
  }
  const was = {};
  for (const r of (p.stored ? p.stored.rungs : [])) was[r.tier] = r;
  const changed = new Set(p.changes.map(c => c.tier + ":" + c.field));
  const cols = [["rides", "Rides"], ["long_min", "Long ride"], ["hard", "Hard"], ["hard_min", "Hard min"],
                ["lit_min", "Easy ride"]];
  const cell = (r, f) => {
    const td = h("td", {}, String(r[f]));
    if (p.stored && changed.has(r.tier + ":" + f)) {
      td.className = "chg";
      const old = was[r.tier] ? was[r.tier][f] : null;
      td.replaceChildren(old === null ? "" : h("span", {class: "was"}, String(old)), String(r[f]));
    }
    return td;
  };
  const hoursCell = r => {
    const td = h("td", {}, r.hours + "h");
    const old = was[r.tier];
    if (p.stored && (!old || old.hours !== r.hours)) {
      td.className = "chg";
      td.replaceChildren(old ? h("span", {class: "was"}, old.hours + "h") : "", r.hours + "h");
    }
    return td;
  };
  const o = p.observed;
  const status = h("div", {});
  const keep = h("button", {class: "primary", disabled: p.same}, p.stored ? "Use this ladder" : "Keep this ladder");
  keep.addEventListener("click", async () => {
    keep.disabled = true;
    try {
      const out = await api("POST", "/api/ladder", {replace: !!p.stored});
      const regen = h("button", {}, "Rebuild the plan from it");
      const result = h("div", {});
      regen.addEventListener("click", async () => {
        regen.disabled = true;
        result.replaceChildren(h("div", {class: "msg note"}, "Working…"));
        try {
          const r = await api("POST", "/api/plan/regenerate");
          result.replaceChildren(h("div", {class: r.errors.length ? "msg bad" : "msg good"}, r.summary));
        } catch (e) {
          result.replaceChildren(h("div", {class: "msg bad", role: "alert"}, e.message));
        } finally { regen.disabled = false; }
      });
      status.replaceChildren(
        h("div", {class: "msg good"}, "Stored as ladder version " + out.version + ". Weeks already decided keep the version they were graded against."),
        h("p", {class: "hint"}, "Rebuilding rewrites the stored sessions from the next two days on. It does not touch your intervals.icu calendar; that happens on the next sync."),
        regen, result);
    } catch (e) {
      status.replaceChildren(h("div", {class: "msg bad", role: "alert"}, e.message));
      keep.disabled = false;
    }
  });
  main.replaceChildren(...intro,
    h("div", {class: "card"},
      h("h3", {}, p.stored ? "Stored: version " + p.stored.version + ". Re-derived from your history under your current settings:"
                           : "Nothing stored yet. Derived from your history under your current settings:"),
      h("div", {class: "obs"},
        h("span", {}, "recently ", h("b", {}, o.recent_hours + "h a week"), " over ", h("b", {}, o.recent_days + " days")),
        h("span", {}, "longest ", h("b", {}, o.recent_long_min + " min")),
        h("span", {}, "best sustained ", h("b", {}, o.sustained_hours + "h a week"), " since " + o.sustained_since),
        h("span", {}, o.weeks_with_a_ride[0] + " of " + o.weeks_with_a_ride[1] + " weeks with a ride")),
      h("div", {class: "scroll"}, h("table", {class: "rungs"},
        h("thead", {}, h("tr", {}, h("th", {}, "Tier"), cols.map(([, l]) => h("th", {}, l)), h("th", {}, "Week"))),
        h("tbody", {}, p.derived.map(r => h("tr", {}, h("td", {}, "T" + r.tier),
          cols.map(([f]) => cell(r, f)), hoursCell(r)))))),
      p.same ? h("div", {class: "msg good"}, "Nothing would change: the stored ladder is already what these settings produce.") : null,
      !p.same && p.stored ? h("p", {class: "hint"}, "Shaded cells would change, with the stored value struck through.") : null,
      p.notes.map(n => h("div", {class: "msg note"}, n))),
    status,
    h("div", {class: "bar"}, keep));
}

// ---- routing ----------------------------------------------------------------------------------
const views = {plan: planView, setup: setupView, settings: settingsView, ladder: ladderView};
async function route() {
  const name = views[(location.hash || "#plan").slice(1)] ? (location.hash || "#plan").slice(1) : "plan";
  const view = views[name];
  document.querySelectorAll("nav a[data-view]").forEach(a =>
    a.classList.toggle("on", a.dataset.view === name));
  try { await view(); }
  catch (e) { main.replaceChildren(h("div", {class: "msg bad", role: "alert"}, e.message)); }
}
addEventListener("hashchange", route);
route();
</script>
</body>
